<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سويا ريس - Soiya Race</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    perspective: 1200px;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 1000px;
    padding: 30px;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 3rem;
    background: linear-gradient(90deg, #ff6b00, #ffcc00, #ff6b00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
    margin-bottom: 10px;
    animation: glow 2s infinite alternate;
  }

  @keyframes glow {
    from { filter: drop-shadow(0 0 10px #ff6b00); }
    to { filter: drop-shadow(0 0 25px #ffcc00); }
  }

  .subtitle {
    color: #ffcc00;
    font-size: 1.2rem;
    margin-bottom: 40px;
    letter-spacing: 3px;
  }

  input[type="text"] {
    width: 80%;
    max-width: 400px;
    padding: 15px 20px;
    font-size: 1.2rem;
    border: 2px solid #ff6b00;
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    text-align: center;
    outline: none;
    transition: 0.3s;
  }
  input[type="text"]:focus {
    box-shadow: 0 0 25px #ff6b00;
    background: rgba(255,255,255,0.15);
  }
  input::placeholder { color: #aaa; }

  .btn {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 50px;
    font-size: 1.3rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ff6b00, #ff0040);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 8px 25px rgba(255, 107, 0, 0.5);
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 35px rgba(255, 107, 0, 0.8);
  }
  .btn:active { transform: scale(0.97); }

  /* Welcome */
  #welcomeMsg {
    font-size: 2rem;
    color: #ffcc00;
    margin: 30px 0;
    text-shadow: 0 0 20px rgba(255,204,0,0.6);
  }

  /* Car selection */
  .cars-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 25px;
    margin-top: 40px;
    perspective: 1500px;
  }

  .car-card {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,107,0,0.3);
    border-radius: 20px;
    padding: 20px;
    cursor: pointer;
    transition: 0.4s;
    transform-style: preserve-3d;
  }
  .car-card:hover {
    border-color: #ffcc00;
    transform: translateY(-10px) rotateY(5deg);
    box-shadow: 0 20px 50px rgba(255,204,0,0.3);
  }
  .car-card.selected {
    border-color: #00ff88;
    box-shadow: 0 0 40px #00ff88;
  }
  .car-card h3 {
    margin-top: 15px;
    font-size: 1.2rem;
    color: #ffcc00;
  }

  /* ============ 3D VEHICLES ============ */
  .vehicle-3d {
    width: 160px;
    height: 100px;
    margin: 0 auto;
    position: relative;
    transform-style: preserve-3d;
    animation: rotate3d 8s infinite linear;
  }
  @keyframes rotate3d {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  /* Car body */
  .car-body {
    position: absolute;
    width: 140px;
    height: 50px;
    top: 20px;
    left: 10px;
    border-radius: 10px 10px 5px 5px;
    transform-style: preserve-3d;
  }
  .car-body::before {
    content: '';
    position: absolute;
    width: 80px;
    height: 35px;
    top: -30px;
    left: 30px;
    border-radius: 15px 15px 0 0;
    background: inherit;
    filter: brightness(1.2);
  }

  /* Wheels */
  .wheel {
    position: absolute;
    width: 30px;
    height: 30px;
    background: radial-gradient(circle, #333 30%, #000 70%);
    border-radius: 50%;
    border: 3px solid #555;
    bottom: 5px;
    box-shadow: inset 0 0 8px #000;
  }
  .wheel.l1 { left: 15px; }
  .wheel.l2 { right: 15px; }
  .wheel::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    background: #888;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }

  /* Motorcycle */
  .moto-body {
    position: absolute;
    width: 100px;
    height: 20px;
    top: 50px;
    left: 30px;
    background: #c0392b;
    border-radius: 10px;
    transform: rotate(-5deg);
  }
  .moto-seat {
    position: absolute;
    width: 35px;
    height: 15px;
    top: 40px;
    left: 20px;
    background: #2c3e50;
    border-radius: 8px;
  }
  .moto-handle {
    position: absolute;
    width: 40px;
    height: 5px;
    top: 38px;
    right: 20px;
    background: #444;
    border-radius: 3px;
    transform: rotate(-20deg);
  }
  .moto-wheel {
    position: absolute;
    width: 38px;
    height: 38px;
    border: 4px solid #222;
    background: radial-gradient(circle, #555 20%, #111 80%);
    border-radius: 50%;
    top: 55px;
  }
  .moto-wheel.front { right: 20px; }
  .moto-wheel.back  { left: 20px; }

  /* Colors */
  .bmw    .car-body { background: linear-gradient(180deg,#1e90ff,#0047ab); box-shadow: 0 0 25px #1e90ff; }
  .mercedes .car-body { background: linear-gradient(180deg,#c0c0c0,#808080); box-shadow: 0 0 25px #c0c0c0; }
  .ferrari .car-body { background: linear-gradient(180deg,#ff1a1a,#8b0000); box-shadow: 0 0 25px #ff1a1a; }

  /* Race screen */
  #raceScreen { max-width: 100%; }
  .track {
    position: relative;
    width: 100%;
    height: 400px;
    background: repeating-linear-gradient(
      90deg,
      #333 0px, #333 40px,
      #444 40px, #444 80px
    );
    border-radius: 15px;
    overflow: hidden;
    margin: 20px 0;
    box-shadow: inset 0 0 50px #000;
    perspective: 800px;
  }
  .lane {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    border-right: 3px dashed #ffcc00;
  }
  .lane:last-child { border: none; }

  .racer {
    position: absolute;
    bottom: 20px;
    font-size: 3.5rem;
    transition: bottom 0.1s linear;
    filter: drop-shadow(0 0 15px #ff6b00);
  }
  .racer.player { right: 25%; transform: translateX(50%); }
  .racer.enemy  { left: 25%;  transform: translateX(-50%); }

  .finish-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 20px;
    background: repeating-linear-gradient(
      45deg, #000 0 10px, #fff 10px 20px
    );
  }

  .race-info {
    display: flex;
    justify-content: space-around;
    font-size: 1.3rem;
    margin: 15px 0;
  }
  .race-info span { color: #ffcc00; font-weight: bold; }

  #resultMsg {
    font-size: 2.5rem;
    margin-top: 20px;
    animation: glow 1s infinite alternate;
  }
  .win  { color: #00ff88; }
  .lose { color: #ff0040; }

  .emoji-car {
    display: inline-block;
    font-size: 3rem;
    animation: rotate3d 6s infinite linear;
  }
</style>
</head>
<body>

<!-- Screen 1: Enter Name -->
<div class="screen active" id="nameScreen">
  <h1>🏁 سويا ريس 🏁</h1>
  <p class="subtitle">SOIYA RACE</p>
  <div style="margin: 40px 0;">
    <input type="text" id="playerName" placeholder="اكتب اسم المتسابق..." maxlength="20">
  </div>
  <button class="btn" onclick="enterName()">ادخل 🚀</button>
</div>

<!-- Screen 2: Welcome -->
<div class="screen" id="welcomeScreen">
  <h1>🏁 سويا ريس 🏁</h1>
  <div id="welcomeMsg"></div>
  <button class="btn" onclick="showCars()">اختر عربيتك 🏎️</button>
</div>

<!-- Screen 3: Car Selection -->
<div class="screen" id="carScreen">
  <h1>اختر عربيتك</h1>
  <p class="subtitle">Choose Your Ride</p>
  <div class="cars-grid">
    
    <!-- Motorcycle -->
    <div class="car-card" onclick="selectCar(this,'🏍️','موتوسيكل')">
      <div class="vehicle-3d">
        <div class="moto-wheel back"></div>
        <div class="moto-wheel front"></div>
        <div class="moto-body"></div>
        <div class="moto-seat"></div>
        <div class="moto-handle"></div>
      </div>
      <h3>🏍️ موتوسيكل</h3>
    </div>

    <!-- BMW -->
    <div class="car-card bmw" onclick="selectCar(this,'🏎️','BMW')">
      <div class="vehicle-3d">
        <div class="car-body"></div>
        <div class="wheel l1"></div>
        <div class="wheel l2"></div>
      </div>
      <h3>🚗 BMW</h3>
    </div>

    <!-- Mercedes -->
    <div class="car-card mercedes" onclick="selectCar(this,'🚙','مرسيدس')">
      <div class="vehicle-3d">
        <div class="car-body"></div>
        <div class="wheel l1"></div>
        <div class="wheel l2"></div>
      </div>
      <h3>🚙 مرسيدس</h3>
    </div>

    <!-- Ferrari -->
    <div class="car-card ferrari" onclick="selectCar(this,'🏎️','فيراري')">
      <div class="vehicle-3d">
        <div class="car-body"></div>
        <div class="wheel l1"></div>
        <div class="wheel l2"></div>
      </div>
      <h3>🏎️ فيراري</h3>
    </div>

  </div>
</div>

<!-- Screen 4: Race -->
<div class="screen" id="raceScreen">
  <h1>🏁 السباق بدأ! 🏁</h1>
  <div class="race-info">
    <div>👤 <span id="raceName"></span></div>
    <div>🚗 <span id="raceCar"></span></div>
  </div>
  <div class="track">
    <div class="finish-line"></div>
    <div class="lane"></div>
    <div class="lane"></div>
    <div class="racer player" id="playerRacer">🏎️</div>
    <div class="racer enemy"  id="enemyRacer">🚙</div>
  </div>
  <div style="font-size:2rem; margin-top:15px;">
    المسافة: <span id="distLabel" style="color:#ffcc00">0%</span>
  </div>
  <button class="btn" id="boostBtn" onclick="boost()">🚀 نترو!</button>
  <div id="resultMsg"></div>
  <button class="btn" id="againBtn" style="display:none;" onclick="location.reload()">🔄 العب تاني</button>
</div>

<script>
  let playerName = "";
  let playerCarEmoji = "";
  let playerCarName = "";

  // Screen 1 -> 2
  function enterName() {
    const input = document.getElementById("playerName");
    const name = input.value.trim();
    if (!name) { alert("اكتب اسمك يا بطل!"); return; }

    playerName = name;
    document.getElementById("welcomeMsg").innerHTML =
      `👋 أهلاً <span style="color:#ff6b00">${name}</span>!<br>يلا نبدأ السباق!`;
    switchScreen("welcomeScreen");
  }

  // Screen 2 -> 3
  function showCars() {
    switchScreen("carScreen");
  }

  // Select car
  function selectCar(card, emoji, name) {
    document.querySelectorAll(".car-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    playerCarEmoji = emoji;
    playerCarName = name;

    // small delay for visual feedback
    setTimeout(startRace, 500);
  }

  // Screen 3 -> 4 (Race)
  let playerPos = 0;
  let enemyPos = 0;
  let gameLoop = null;
  let boostPower = 0;
  let raceOver = false;

  function startRace() {
    switchScreen("raceScreen");
    document.getElementById("raceName").textContent = playerName;
    document.getElementById("raceCar").textContent = playerCarName;
    document.getElementById("playerRacer").textContent = playerCarEmoji;

    // Random enemy car
    const enemies = ["🏎️","🚙","🚗","🏍️","🚕"];
    document.getElementById("enemyRacer").textContent =
      enemies[Math.floor(Math.random()*enemies.length)];

    playerPos = 0;
    enemyPos = 0;
    boostPower = 0;
    raceOver = false;

    // Main loop
    gameLoop = setInterval(updateRace, 50);
    // Auto boost toggle
    setInterval(autoBoost, 3000);
  }

  function boost() {
    if (raceOver) return;
    boostPower = 20;
  }

  function autoBoost() {
    boostPower = Math.max(0, boostPower - 2);
  }

  function updateRace() {
    if (raceOver) return;

    // player speed: base + random + boost
    let playerSpeed = 0.35 + Math.random() * 0.5 + boostPower * 0.08;
    // enemy speed: slightly harder
    let enemySpeed = 0.4 + Math.random() * 0.5;

    playerPos += playerSpeed;
    enemyPos  += enemySpeed;

    // decay boost
    if (boostPower > 0) boostPower -= 0.3;

    if (playerPos >= 100) playerPos = 100;
    if (enemyPos  >= 100) enemyPos = 100;

    // Move racers (bottom 20px -> up to 360px)
    const maxMove = 330;
    document.getElementById("playerRacer").style.bottom =
      (20 + (playerPos / 100) * maxMove) + "px";
    document.getElementById("enemyRacer").style.bottom =
      (20 + (enemyPos / 100) * maxMove) + "px";

    document.getElementById("distLabel").textContent =
      Math.floor(Math.max(playerPos, enemyPos)) + "%";

    if (playerPos >= 100 || enemyPos >= 100) {
      raceOver = true;
      clearInterval(gameLoop);
      const result = document.getElementById("resultMsg");
      if (playerPos >= enemyPos) {
        result.textContent = "🏆 " + playerName + " كسب! 🏆";
        result.className = "win";
      } else {
        result.textContent = "😢 " + playerName + " خسر! 😢";
        result.className = "lose";
      }
      document.getElementById("boostBtn").style.display = "none";
      document.getElementById("againBtn").style.display = "inline-block";
    }
  }

  function switchScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  // Enter key support
  document.getElementById("playerName").addEventListener("keypress", e => {
    if (e.key === "Enter") enterName();
  });
</script>
</body>
</html>
