<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سويا ريس - Soiya Race</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 1000px;
    padding: 30px;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 3rem;
    background: linear-gradient(90deg, #ff6b00, #ffcc00, #ff6b00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    animation: glow 2s infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 10px #ff6b00); }
    to { filter: drop-shadow(0 0 25px #ffcc00); }
  }

  .subtitle {
    color: #ffcc00;
    font-size: 1.2rem;
    margin-bottom: 40px;
    letter-spacing: 3px;
  }

  input[type="text"] {
    width: 80%;
    max-width: 400px;
    padding: 15px 20px;
    font-size: 1.2rem;
    border: 2px solid #ff6b00;
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    text-align: center;
    outline: none;
    transition: 0.3s;
  }
  input[type="text"]:focus {
    box-shadow: 0 0 25px #ff6b00;
    background: rgba(255,255,255,0.15);
  }
  input::placeholder { color: #aaa; }

  .btn {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 50px;
    font-size: 1.3rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ff6b00, #ff0040);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 8px 25px rgba(255, 107, 0, 0.5);
  }
  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 35px rgba(255, 107, 0, 0.8);
  }
  .btn:active { transform: scale(0.97); }

  #welcomeMsg {
    font-size: 2rem;
    color: #ffcc00;
    margin: 30px 0;
    text-shadow: 0 0 20px rgba(255,204,0,0.6);
  }

  /* ============ CAR SELECTION ============ */
  .cars-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 25px;
    margin-top: 40px;
  }

  .car-card {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,107,0,0.3);
    border-radius: 20px;
    padding: 20px;
    cursor: pointer;
    transition: 0.3s;
  }
  .car-card:hover {
    border-color: #ffcc00;
    transform: translateY(-10px);
    box-shadow: 0 20px 50px rgba(255,204,0,0.3);
  }
  .car-card.selected {
    border-color: #00ff88;
    box-shadow: 0 0 40px #00ff88;
  }
  .car-card h3 {
    margin-top: 15px;
    font-size: 1.2rem;
    color: #ffcc00;
  }

  /* ====== 2D CARTOON VEHICLES (SVG style) ====== */
  .vehicle-2d {
    width: 160px;
    height: 100px;
    margin: 0 auto;
    position: relative;
  }

  /* Car 2D */
  .car-shape {
    position: absolute;
    bottom: 20px;
    left: 10px;
    width: 140px;
    height: 45px;
    border-radius: 12px 12px 8px 8px;
  }
  .car-roof {
    position: absolute;
    bottom: 62px;
    left: 40px;
    width: 80px;
    height: 28px;
    border-radius: 18px 18px 0 0;
  }
  .car-window {
    position: absolute;
    bottom: 66px;
    width: 32px;
    height: 20px;
    background: rgba(150,220,255,0.85);
    border-radius: 6px 6px 0 0;
  }
  .car-window.w1 { left: 46px; }
  .car-window.w2 { right: 46px; }
  .wheel2d {
    position: absolute;
    bottom: 10px;
    width: 30px;
    height: 30px;
    background: #111;
    border-radius: 50%;
    border: 4px solid #444;
  }
  .wheel2d::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    background: #999;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }
  .wheel2d.wl { left: 20px; }
  .wheel2d.wr { right: 20px; }

  /* BMW colors */
  .bmw .car-shape    { background: linear-gradient(180deg,#2196f3,#0d47a1); box-shadow: 0 0 15px #2196f3; }
  .bmw .car-roof     { background: #1976d2; }

  /* Mercedes */
  .mercedes .car-shape { background: linear-gradient(180deg,#e0e0e0,#9e9e9e); box-shadow: 0 0 15px #e0e0e0; }
  .mercedes .car-roof  { background: #bdbdbd; }

  /* Ferrari */
  .ferrari .car-shape  { background: linear-gradient(180deg,#f44336,#b71c1c); box-shadow: 0 0 15px #f44336; }
  .ferrari .car-roof   { background: #d32f2f; }

  /* Motorcycle 2D */
  .moto-shape {
    position: absolute;
    bottom: 42px;
    left: 30px;
    width: 100px;
    height: 18px;
    background: #e53935;
    border-radius: 10px;
    transform: rotate(-6deg);
  }
  .moto-seat2d {
    position: absolute;
    bottom: 55px;
    left: 15px;
    width: 40px;
    height: 14px;
    background: #212121;
    border-radius: 8px;
  }
  .moto-handle2d {
    position: absolute;
    bottom: 60px;
    right: 18px;
    width: 42px;
    height: 5px;
    background: #333;
    border-radius: 3px;
    transform: rotate(-25deg);
  }
  .moto-wheel2d {
    position: absolute;
    bottom: 8px;
    width: 34px;
    height: 34px;
    background: radial-gradient(circle, #555 30%, #111 70%);
    border: 3px solid #222;
    border-radius: 50%;
  }
  .moto-wheel2d.mw1 { left: 15px; }
  .moto-wheel2d.mw2 { right: 15px; }

  /* ====== RACE SCREEN ====== */
  #raceScreen { max-width: 100%; }

  .race-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    margin-bottom: 15px;
    font-size: 1.1rem;
  }
  .race-header span { color: #ffcc00; font-weight: bold; }

  .road {
    position: relative;
    width: 100%;
    height: 500px;
    background: #2b2b2b;
    border-radius: 15px;
    overflow: hidden;
    border: 4px solid #444;
    box-shadow: inset 0 0 60px #000;
  }

  /* Road center dash */
  .road::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 8px;
    transform: translateX(-50%);
    background: repeating-linear-gradient(
      to bottom,
      #ffcc00 0 30px,
      transparent 30px 60px
    );
    animation: roadMove 0.4s linear infinite;
  }
  @keyframes roadMove {
    from { background-position-y: 0; }
    to   { background-position-y: 60px; }
  }

  /* Road edges */
  .road-edge {
    position: absolute;
    top: 0; bottom: 0;
    width: 12px;
    background: repeating-linear-gradient(
      to bottom,
      #fff 0 20px,
      #e53935 20px 40px
    );
    animation: roadMove 0.4s linear infinite;
  }
  .road-edge.left  { left: 0; }
  .road-edge.right { right: 0; }

  /* Finish line at top */
  .finish-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 25px;
    background: repeating-linear-gradient(
      90deg,
      #fff 0 20px,
      #000 20px 40px
    );
    z-index: 3;
  }

  /* Player & enemy vehicles */
  .racer {
    position: absolute;
    bottom: 20px;
    font-size: 3.5rem;
    z-index: 5;
    transition: bottom 0.08s linear;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6));
  }
  .racer.player { left: 25%; transform: translateX(-50%); }
  .racer.enemy  { right: 25%; transform: translateX(50%); }

  .race-info {
    display: flex;
    justify-content: space-around;
    font-size: 1.3rem;
    margin: 15px 0;
  }
  .race-info span { color: #ffcc00; font-weight: bold; }

  .progress-bar {
    height: 16px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    margin: 6px 0;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ff88, #00c853);
    transition: width 0.1s linear;
  }
  .progress-fill.enemy {
    background: linear-gradient(90deg, #ff5252, #b71c1c);
  }

  #resultMsg {
    font-size: 2.5rem;
    margin-top: 20px;
    animation: glow 1s infinite alternate;
  }
  .win  { color: #00ff88; }
  .lose { color: #ff0040; }

  .controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 15px;
  }
</style>
</head>
<body>

<!-- Screen 1: Enter Name -->
<div class="screen active" id="nameScreen">
  <h1>🏁 سويا ريس 🏁</h1>
  <p class="subtitle">SOIYA RACE</p>
  <div style="margin: 40px 0;">
    <input type="text" id="playerName" placeholder="اكتب اسم المتسابق..." maxlength="20">
  </div>
  <button class="btn" onclick="enterName()">ادخل 🚀</button>
</div>

<!-- Screen 2: Welcome -->
<div class="screen" id="welcomeScreen">
  <h1>🏁 سويا ريس 🏁</h1>
  <div id="welcomeMsg"></div>
  <button class="btn" onclick="showCars()">اختر عربيتك 🏎️</button>
</div>

<!-- Screen 3: Car Selection -->
<div class="screen" id="carScreen">
  <h1>اختر عربيتك</h1>
  <p class="subtitle">Choose Your Ride</p>
  <div class="cars-grid">

    <!-- Motorcycle -->
    <div class="car-card" onclick="selectCar(this,'🏍️','موتوسيكل')">
      <div class="vehicle-2d">
        <div class="moto-wheel2d mw1"></div>
        <div class="moto-wheel2d mw2"></div>
        <div class="moto-seat2d"></div>
        <div class="moto-shape"></div>
        <div class="moto-handle2d"></div>
      </div>
      <h3>🏍️ موتوسيكل</h3>
    </div>

    <!-- BMW -->
    <div class="car-card bmw" onclick="selectCar(this,'🏎️','BMW')">
      <div class="vehicle-2d">
        <div class="wheel2d wl"></div>
        <div class="wheel2d wr"></div>
        <div class="car-shape"></div>
        <div class="car-roof"></div>
        <div class="car-window w1"></div>
        <div class="car-window w2"></div>
      </div>
      <h3>🚗 BMW</h3>
    </div>

    <!-- Mercedes -->
    <div class="car-card mercedes" onclick="selectCar(this,'🚙','مرسيدس')">
      <div class="vehicle-2d">
        <div class="wheel2d wl"></div>
        <div class="wheel2d wr"></div>
        <div class="car-shape"></div>
        <div class="car-roof"></div>
        <div class="car-window w1"></div>
        <div class="car-window w2"></div>
      </div>
      <h3>🚙 مرسيدس</h3>
    </div>

    <!-- Ferrari -->
    <div class="car-card ferrari" onclick="selectCar(this,'🏎️','فيراري')">
      <div class="vehicle-2d">
        <div class="wheel2d wl"></div>
        <div class="wheel2d wr"></div>
        <div class="car-shape"></div>
        <div class="car-roof"></div>
        <div class="car-window w1"></div>
        <div class="car-window w2"></div>
      </div>
      <h3>🏎️ فيراري</h3>
    </div>

  </div>
</div>

<!-- Screen 4: Race -->
<div class="screen" id="raceScreen">
  <div class="race-header">
    <div>👤 اللاعب: <span id="raceName"></span></div>
    <div>🚗 العربية: <span id="raceCar"></span></div>
  </div>

  <div class="road">
    <div class="finish-line"></div>
    <div class="road-edge left"></div>
    <div class="road-edge right"></div>
    <div class="racer player" id="playerRacer">🏎️</div>
    <div class="racer enemy"  id="enemyRacer">🚙</div>
  </div>

  <div class="race-info">
    <div>أنت: <span id="playerPct">0%</span></div>
    <div>الخصم: <span id="enemyPct">0%</span></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="playerBar"></div></div>
  <div class="progress-bar"><div class="progress-fill enemy" id="enemyBar"></div></div>

  <div class="controls">
    <button class="btn" id="boostBtn" onclick="boost()">🚀 نترو!</button>
    <button class="btn" id="againBtn" style="display:none;" onclick="location.reload()">🔄 العب تاني</button>
  </div>

  <div id="resultMsg"></div>
</div>

<script>
  let playerName = "";
  let playerCarEmoji = "";
  let playerCarName = "";

  // Screen transitions
  function enterName() {
    const name = document.getElementById("playerName").value.trim();
    if (!name) { alert("اكتب اسمك يا بطل!"); return; }
    playerName = name;
    document.getElementById("welcomeMsg").innerHTML =
      `👋 أهلاً <span style="color:#ff6b00">${name}</span>!<br>يلا نبدأ السباق!`;
    switchScreen("welcomeScreen");
  }

  function showCars() { switchScreen("carScreen"); }

  function selectCar(card, emoji, name) {
    document.querySelectorAll(".car-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    playerCarEmoji = emoji;
    playerCarName  = name;
    setTimeout(startRace, 400);
  }

  // Race logic
  let playerPos = 0, enemyPos = 0;
  let gameLoop = null, boostPower = 0, raceOver = false;
  let autoBoostTimer = null;

  function startRace() {
    switchScreen("raceScreen");
    document.getElementById("raceName").textContent = playerName;
    document.getElementById("raceCar").textContent  = playerCarName;
    document.getElementById("playerRacer").textContent = playerCarEmoji;

    const enemies = ["🏎️","🚙","🚗","🏍️","🚕"];
    document.getElementById("enemyRacer").textContent =
      enemies[Math.floor(Math.random()*enemies.length)];

    playerPos = 0; enemyPos = 0; boostPower = 0; raceOver = false;

    gameLoop = setInterval(updateRace, 50);
    autoBoostTimer = setInterval(() => {
      boostPower = Math.max(0, boostPower - 2);
    }, 3000);
  }

  function boost() {
    if (raceOver) return;
    boostPower = 20;
  }

  function updateRace() {
    if (raceOver) return;

    const playerSpeed = 0.35 + Math.random() * 0.5 + boostPower * 0.08;
    const enemySpeed  = 0.45 + Math.random() * 0.5;

    playerPos += playerSpeed;
    enemyPos  += enemySpeed;

    if (boostPower > 0) boostPower -= 0.3;

    if (playerPos > 100) playerPos = 100;
    if (enemyPos  > 100) enemyPos  = 100;

    // Move vehicles on the road (max = road height - some padding)
    const roadHeight = 500;
    const padding = 20;
    const maxTravel = roadHeight - 100 - padding;
    document.getElementById("playerRacer").style.bottom =
      (padding + (playerPos/100) * maxTravel) + "px";
    document.getElementById("enemyRacer").style.bottom =
      (padding + (enemyPos/100)  * maxTravel) + "px";

    // Progress bars
    document.getElementById("playerPct").textContent = Math.floor(playerPos) + "%";
    document.getElementById("enemyPct").textContent  = Math.floor(enemyPos)  + "%";
    document.getElementById("playerBar").style.width = playerPos + "%";
    document.getElementById("enemyBar").style.width  = enemyPos  + "%";

    if (playerPos >= 100 || enemyPos >= 100) {
      raceOver = true;
      clearInterval(gameLoop);
      clearInterval(autoBoostTimer);

      const result = document.getElementById("resultMsg");
      if (playerPos >= enemyPos) {
        result.textContent = "🏆 " + playerName + " كسب! 🏆";
        result.className = "win";
      } else {
        result.textContent = "😢 " + playerName + " خسر! 😢";
        result.className = "lose";
      }
      document.getElementById("boostBtn").style.display = "none";
      document.getElementById("againBtn").style.display = "inline-block";
    }
  }

  function switchScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  // Enter key support
  document.getElementById("playerName").addEventListener("keypress", e => {
    if (e.key === "Enter") enterName();
  });
</script>
</body>
</html>
