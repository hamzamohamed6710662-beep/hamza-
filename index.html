
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOOYAH RACING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111d;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
button,input{font:inherit}
button{cursor:pointer;color:white}
.screen{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:18px}
.screen.active{display:flex}
.panel{width:min(600px,100%);padding:25px;text-align:center;background:linear-gradient(145deg,#142b43,#030914);border:1px solid #00cfff;border-radius:20px;box-shadow:0 0 35px #009dff33}
.logo{font-size:clamp(38px,9vw,70px);font-weight:1000;font-style:italic;color:#4adfff;text-shadow:0 0 22px #008cff}
h2{font-size:clamp(22px,5vw,32px)}
p{color:#a9c5de}
input{display:block;width:100%;max-width:350px;margin:20px auto;padding:13px;border-radius:10px;border:1px solid #00bfff;background:#07111d;color:white;text-align:center}
.btn{padding:12px 22px;border:1px solid #70eaff;border-radius:10px;background:linear-gradient(120deg,#078bea,#064ab0);font-weight:bold;margin:5px}
.btn:active{transform:scale(.96)}
.options{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px 0}
.option{background:#10243a;border:1px solid #42627e;padding:13px;border-radius:12px;min-width:105px}
.option.selected{border:2px solid #00d9ff;box-shadow:0 0 15px #00bfff55}
#game{position:fixed;inset:0;display:none;background:#8cc9e9}
#game.active{display:block}
#cv{width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud button,.hud span{pointer-events:auto}
.info{padding:9px 12px;background:#071525df;border:1px solid #55cfff;border-radius:10px;font-weight:bold;font-size:13px}
#controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;padding:0 13px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;gap:10px}
#controls button{pointer-events:auto;touch-action:none}
.steering{display:flex;gap:8px}
.steer{width:clamp(55px,12vw,76px);height:clamp(55px,12vw,76px);border-radius:50%;font-size:27px;background:#0a1d31e8;border:2px solid #b9efff;box-shadow:0 0 15px #008cff44}
.pedals{display:flex;gap:9px;align-items:end}
.pedal{width:clamp(65px,14vw,88px);height:clamp(105px,19vh,145px);border-radius:12px;border:2px solid white;display:flex;flex-direction:column;align-items:center;justify-content:space-around;font-weight:bold;font-size:12px}
#gas{background:linear-gradient(#146b48,#061b14)}
#brake{background:linear-gradient(#a52c37,#290b12)}
.plate{height:55%;width:65%;border-radius:5px;border:2px solid #b7c6d0;background:repeating-linear-gradient(120deg,#b9c5cf 0 5px,#3d4d5c 5px 10px)}
#message{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#020812cc;text-align:center;padding:20px}
#message.show{display:flex}
.card{padding:26px;background:#091829;border:1px solid #36d9ff;border-radius:18px;max-width:400px;width:100%}
@media(max-height:500px){
 .pedal{height:85px;width:62px}.plate{height:35%}
 .steer{width:48px;height:48px}
}
</style>
</head>
<body>

<section id="intro" class="screen active">
 <div class="panel">
  <div style="font-size:30px">♛</div>
  <div class="logo">SOOYAH</div>
  <div class="logo" style="font-size:30px">RACING</div>
  <p>حركة حقيقية • عفرة • صوت موتور</p>
  <button class="btn" onclick="show('name')">NEXT ➜</button>
 </div>
</section>

<section id="name" class="screen">
 <div class="panel">
  <h2>Enter the name</h2>
  <input id="nameInput" maxlength="20" placeholder="اكتب اسم المتسابق">
  <button class="btn" onclick="enterName()">NEXT ➜</button>
 </div>
</section>

<section id="welcome" class="screen">
 <div class="panel">
  <div class="logo" style="font-size:38px">SOOYAH RACING</div>
  <h2 id="hello">Hi, Driver!</h2>
  <button class="btn" onclick="show('garage')">ENTER GAME ➜</button>
 </div>
</section>

<section id="garage" class="screen">
 <div class="panel">
  <h2>اختار عربيتك</h2>
  <div class="options" id="cars">
   <button class="option selected" onclick="chooseCar(0,this)">🚘<br>Mercedes</button>
   <button class="option" onclick="chooseCar(1,this)">🏎️<br>BMW</button>
   <button class="option" onclick="chooseCar(2,this)">🏎️<br>Supercar</button>
  </div>
  <h2>اختار الطريق</h2>
  <div class="options" id="modes">
   <button class="option selected" onclick="chooseMode('race',this)">🏁<br>سباق</button>
   <button class="option" onclick="chooseMode('endless',this)">🌆<br>طريق لا نهائي</button>
   <button class="option" onclick="chooseMode('rough',this)">⛰️<br>طريق وعر</button>
  </div>
  <button class="btn" onclick="startGame()">ابدأ القيادة 🚀</button>
 </div>
</section>

<section id="game">
 <canvas id="cv"></canvas>
 <div class="hud">
  <span class="info">السرعة: <b id="speed">0</b> كم/س</span>
  <span class="info">المسافة: <b id="dist">0</b> م</span>
  <div>
   <button class="btn" style="margin:0;padding:8px" onclick="toggleSound()">🔊</button>
   <button class="btn" style="margin:0;padding:8px" onclick="backGarage()">↩ الجراج</button>
  </div>
 </div>
 <div id="controls">
  <div class="steering">
   <button class="steer" id="left">◀</button>
   <button class="steer" id="right">▶</button>
  </div>
  <div class="pedals">
   <button class="pedal" id="brake"><span>فرامل</span><span class="plate"></span><span>BRAKE</span></button>
   <button class="pedal" id="gas"><span>بنزين</span><span class="plate"></span><span>GAS</span></button>
  </div>
 </div>
 <div id="message">
  <div class="card">
   <h2>💥 لقد اصطدمت!</h2>
   <p>حاول تاني وخلي بالك من الطريق.</p>
   <button class="btn" onclick="startGame()">العب مرة أخرى</button>
   <button class="btn" onclick="backGarage()">العودة للجراج</button>
  </div>
 </div>
</section>

<script>
const $=id=>document.getElementById(id);
function show(id){
 document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
 $('game').classList.remove('active');
 if(id==='game')$('game').classList.add('active');
 else $(id).classList.add('active');
}
let player='Driver',car=0,mode='race';
function enterName(){
 player=$('nameInput').value.trim();
 if(!player){$('nameInput').focus();return}
 $('hello').textContent='Hi, '+player+'!';
 show('welcome');
}
$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')enterName()});
function chooseCar(n,b){
 car=n;
 document.querySelectorAll('#cars .option').forEach(x=>x.classList.remove('selected'));
 b.classList.add('selected');
}
function chooseMode(n,b){
 mode=n;
 document.querySelectorAll('#modes .option').forEach(x=>x.classList.remove('selected'));
 b.classList.add('selected');
}

const cv=$('cv'),c=cv.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 cv.width=W*DPR;cv.height=H*DPR;
 c.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

let active=false,last=0,playerX=.5,speed=0,dist=0,scroll=0;
let gas=false,brake=false,steer=0,keys={};
let dust=[],traffic=[],rocks=[],audio=null,osc=null,gain=null;
let soundOn=true,hit=false,spawn=0;

function soundStart(){
 if(!soundOn)return;
 try{
  if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  if(!osc){
   osc=audio.createOscillator();
   const filter=audio.createBiquadFilter();
   gain=audio.createGain();
   osc.type='sawtooth';
   filter.type='lowpass';filter.frequency.value=350;
   gain.gain.value=.0001;
   osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);
   osc.start();
  }
 }catch(e){}
}
function engineSound(){
 if(!audio||!osc)return;
 osc.frequency.setTargetAtTime(45+speed*2.2,audio.currentTime,.06);
 gain.gain.setTargetAtTime(soundOn&&active&&gas?.035:.0001,audio.currentTime,.08);
}
function toggleSound(){
 soundOn=!soundOn;
 if(soundOn)soundStart();
 engineSound();
}
function beep(){
 if(!soundOn)return;
 soundStart();if(!audio)return;
 const o=audio.createOscillator(),g=audio.createGain();
 o.frequency.value=130;g.gain.value=.08;
 o.connect(g);g.connect(audio.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.4);
 o.stop(audio.currentTime+.4);
}

function startGame(){
 $('message').classList.remove('show');
 show('game');resize();
 active=true;hit=false;speed=0;dist=0;scroll=0;playerX=.5;
 dust=[];traffic=[];rocks=[];spawn=0;
 last=performance.now();
 soundStart();
 requestAnimationFrame(loop);
}
function backGarage(){
 active=false;gas=false;brake=false;engineSound();show('garage');
}

function poly(points,fill){
 c.fillStyle=fill;c.beginPath();
 points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
 c.closePath();c.fill();
}
function rounded(x,y,w,h,r,color){
 c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();
}
function road(t){return {x:W*.5+Math.sin(scroll*.0005+t*2)*W*.025,y:H*.28+t*H*.8,w:W*(.10+.65*t)}}

function background(){
 let sky=c.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#58a7df');sky.addColorStop(.45,'#e3e8e1');sky.addColorStop(1,mode==='rough'?'#82745b':'#46745b');
 c.fillStyle=sky;c.fillRect(0,0,W,H);
 // skyline
 for(let i=0;i<22;i++){
  let x=i*W/20,bh=H*(.06+((i*17)%8)/100);
  c.fillStyle=i%2?'#58758a':'#334f66';
  c.fillRect(x,H*.32-bh,W*.028,bh);
  c.fillStyle='#d8efff77';
  for(let yy=H*.32-bh+6;yy<H*.32-4;yy+=10)c.fillRect(x+4,yy,3,4);
 }
 // scenery
 for(let i=0;i<18;i++){
  let t=((i/18+scroll*.00035)%1),p=road(t),s=.2+t*1.4;
  for(let side of [-1,1]){
   let x=p.x+side*(p.w*.62+W*.015);
   if(mode==='rough'){
    poly([[x-16*s,p.y],[x-6*s,p.y-20*s],[x+5*s,p.y-27*s],[x+19*s,p.y-4*s]],'#716450');
    poly([[x-6*s,p.y-20*s],[x+5*s,p.y-27*s],[x+9*s,p.y-14*s]],'#b4a082');
   }else{
    c.fillStyle='#244d3b';c.fillRect(x-3*s,p.y-17*s,6*s,18*s);
    poly([[x,p.y-39*s],[x-14*s,p.y-12*s],[x+14*s,p.y-12*s]],'#246a4a');
    poly([[x,p.y-28*s],[x-12*s,p.y-5*s],[x+12*s,p.y-5*s]],'#34835a');
   }
  }
 }
}
function drawRoad(){
 for(let i=0;i<70;i++){
  let t=i/70,u=(i+1)/70,a=road(t),b=road(u);
  let stripe=Math.floor(i+scroll*.025)%2===0;
  poly([[a.x-a.w*.55,a.y],[a.x+a.w*.55,a.y],[b.x+b.w*.55,b.y],[b.x-b.w*.55,b.y]],stripe?'#c8c7b9':'#6b716f');
  poly([[a.x-a.w*.5,a.y],[a.x+a.w*.5,a.y],[b.x+b.w*.5,b.y],[b.x-b.w*.5,b.y]],mode==='rough'?'#756e60':stripe?'#303b46':'#293440');
  if(i%4<2){
   for(let lane of [-1/3,1/3]){
    let aw=a.w*.006,bw=b.w*.006;
    poly([[a.x+a.w*lane-aw,a.y],[a.x+a.w*lane+aw,a.y],[b.x+b.w*lane+bw,b.y],[b.x+b.w*lane-bw,b.y]],'#fff3cf');
   }
  }
 }
}

function carDraw(x,y,s,type,angle=0){
 c.save();c.translate(x,y);c.rotate(angle);c.scale(s,s);
 // dust shadow
 c.fillStyle='#1118';c.beginPath();c.ellipse(0,10,39,57,0,0,7);c.fill();
 // wheels
 rounded(-35,-32,12,27,4,'#080d12');rounded(23,-32,12,27,4,'#080d12');
 rounded(-35,17,12,27,4,'#080d12');rounded(23,17,12,27,4,'#080d12');
 let colors=['#dbe8f3','#1584ff','#ff263e'];
 let dark=['#34475d','#082b68','#780a18'];
 let g=c.createLinearGradient(-40,0,40,0);
 g.addColorStop(0,dark[type]);g.addColorStop(.24,colors[type]);
 g.addColorStop(.5,'#ffffff');g.addColorStop(.72,colors[type]);g.addColorStop(1,dark[type]);
 c.shadowColor=colors[type];c.shadowBlur=13;
 poly([[-23,-57],[23,-57],[34,-39],[39,24],[25,55],[0,61],[-25,55],[-39,24],[-34,-39]],g);
 c.shadowBlur=0;
 // hood and reflections
 poly([[-24,-49],[24,-49],[29,-24],[-29,-24]],'#ffffff25');
 // front glass
 poly([[-25,-44],[25,-44],[29,-24],[-29,-24]],'#17344a');
 poly([[-19,-42],[-4,-42],[-5,-27],[-24,-27]],'#8be5ff77');
 // roof
 poly([[-25,-20],[25,-20],[21,12],[-21,12]],g);
 // back glass
 poly([[-25,16],[25,16],[23,31],[-23,31]],'#122d42');
 // vents
 if(type!==0){
  rounded(-22,-10,12,4,1,'#07121c');rounded(10,-10,12,4,1,'#07121c');
 }
 // headlights
 c.shadowColor='#e6ffff';c.shadowBlur=13;
 rounded(-29,-52,13,5,2,'#f4ffff');rounded(16,-52,13,5,2,'#f4ffff');
 c.shadowBlur=0;
 // taillights
 c.shadowColor='#ff152d';c.shadowBlur=16;
 rounded(-28,44,17,6,2,'#ff1939');rounded(11,44,17,6,2,'#ff1939');
 c.shadowBlur=0;
 rounded(-19,53,38,6,2,'#111821');
 rounded(-24,54,7,4,2,'#b6c9d7');rounded(17,54,7,4,2,'#b6c9d7');
 c.restore();
}

function spawnDust(){
 let x=W*playerX,y=H*.82;
 for(let i=0;i<3;i++){
  dust.push({
   x:x+Math.random()*32-16,
   y:y+Math.random()*16,
   vx:(Math.random()-.5)*65,
   vy:Math.random()*-45-10,
   life:.6+Math.random()*.8,
   max:.8+Math.random()*.7,
   r:4+Math.random()*11
  });
 }
}
function drawDust(dt){
 for(let i=dust.length-1;i>=0;i--){
  let p=dust[i];
  p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.r+=dt*13;
  if(p.life<=0){dust.splice(i,1);continue}
  c.globalAlpha=Math.max(0,p.life/p.max)*.48;
  c.fillStyle=mode==='rough'?'#b9a68a':'#c9c3ae';
  c.beginPath();c.ellipse(p.x,p.y,p.r,p.r*.7,0,0,Math.PI*2);c.fill();
 }
 c.globalAlpha=1;
}
function drawTraffic(){
 for(let o of traffic){
  let p=road(o.z);
  let x=p.x+p.w*o.x,y=p.y,s=.14+o.z*1.1;
  carDraw(x,y,s,o.type);
 }
}
function drawRocks(){
 for(let r of rocks){
  let p=road(r.z),x=p.x+p.w*r.x,s=.2+r.z*1.2;
  c.fillStyle='#403c35';c.beginPath();
  c.moveTo(x-14*s,p.y);c.lineTo(x-11*s,p.y-13*s);
  c.lineTo(x+1*s,p.y-22*s);c.lineTo(x+17*s,p.y-11*s);
  c.lineTo(x+20*s,p.y);c.closePath();c.fill();
  c.fillStyle='#a69a83';c.beginPath();
  c.moveTo(x-11*s,p.y-13*s);c.lineTo(x+1*s,p.y-22*s);
  c.lineTo(x+5*s,p.y-11*s);c.closePath();c.fill();
 }
}
function loop(now){
 if(!active)return;
 let dt=Math.min((now-last)/1000,.04);last=now;
 if(gas||keys.ArrowUp||keys.w)speed+=80*dt;
 else speed-=15*dt;
 if(brake||keys.ArrowDown||keys.s)speed-=115*dt;
 speed=Math.max(0,Math.min(190,speed));
 let turn=(steer||(keys.ArrowLeft||keys.a?-1:0)||(keys.ArrowRight||keys.d?1:0));
 playerX+=turn*dt*(.65+speed*.005);
 playerX=Math.max(.12,Math.min(.88,playerX));
 dist+=speed*dt*.2;scroll+=speed*dt;
 if(speed>10)spawnDust();
 if(now-spawn>1300-speed*4){
  if(mode==='rough')rocks.push({z:.05,x:Math.random()*.7-.35});
  else{
   traffic.push({z:.04,x:Math.random()*.7-.35,type:Math.floor(Math.random()*3)});
   if(mode==='race')traffic.push({z:.12,x:Math.random()*.7-.35,type:Math.floor(Math.random()*3)});
  }
  spawn=now;
 }
 for(let o of traffic)o.z+=dt*(.16+speed*.0008);
 for(let r of rocks)r.z+=dt*(.16+speed*.0008);
 traffic=traffic.filter(o=>o.z<1.2);
 rocks=rocks.filter(o=>o.z<1.2);
 // collision
 let hitObject=[...traffic,...rocks].find(o=>o.z>.86&&o.z<1.02&&Math.abs(o.x-(playerX-.5)*1.6)<.23);
 if(hitObject){active=false;engineSound();beep();$('message').classList.add('show');return}
 background();drawRoad();drawDust(dt);drawRocks();drawTraffic();
 // suspension movement while accelerating
 let bounce=gas&&speed>20?Math.sin(now*.025)*2:0;
 carDraw(W*playerX,H*.77+bounce,1.2,car,turn*.075);
 $('speed').textContent=Math.round(speed);
 $('dist').textContent=Math.floor(dist);
 engineSound();
 requestAnimationFrame(loop);
}

// Hold-to-use controls for touch, mouse and stylus.
function hold(id,down,up){
 let el=$(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();down();el.setPointerCapture?.(e.pointerId);
 });
 for(let ev of ['pointerup','pointercancel','lostpointercapture'])
  el.addEventListener(ev,e=>{e.preventDefault();up()});
}
hold('left',()=>steer=-1,()=>steer=0);
hold('right',()=>steer=1,()=>steer=0);
hold('gas',()=>{gas=true;soundStart()},()=>gas=false);
hold('brake',()=>brake=true,()=>brake=false);

addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 keys[e.key]=true;
 if(e.key==='ArrowUp'||e.key===' ')soundStart();
},{passive:false});
addEventListener('keyup',e=>keys[e.key]=false);
addEventListener('blur',()=>{gas=false;brake=false;steer=0;keys={}});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){gas=false;brake=false;steer=0}
});
</script>
</body>
</html>
