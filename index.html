<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/jpeg" href="1.jpg">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SOYA RACING</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#07070d;color:#fff;font-family:'Orbitron','Segoe UI',system-ui,sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;z-index:2;overflow-y:auto}
.screen.on{display:flex}
.panel{background:rgba(8,8,18,.72);backdrop-filter:blur(8px);border:1px solid #ffffff22;border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:96vw;box-shadow:0 0 40px #ff2d5533}
h2{font-size:clamp(16px,4.4vw,26px);letter-spacing:3px;text-shadow:0 0 14px #ff2d55}
.logo{font-size:clamp(46px,14vw,120px);line-height:.95;font-style:italic;font-weight:900;letter-spacing:4px;background:linear-gradient(180deg,#fff 10%,#ff2d55 55%,#ff9a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #ff2d5599);animation:pulse 2s infinite alternate}
@keyframes pulse{to{filter:drop-shadow(0 0 40px #ff9a00cc)}}
.tag{letter-spacing:6px;font-size:clamp(10px,2.8vw,16px);color:#ffd9a0}
.btn{font:inherit;font-weight:900;letter-spacing:3px;font-size:16px;color:#fff;border:0;border-radius:40px;padding:14px 34px;cursor:pointer;background:linear-gradient(90deg,#ff2d55,#ff9a00);box-shadow:0 0 24px #ff2d5588,inset 0 2px 0 #fff5;transition:transform .15s}
.btn:hover{transform:scale(1.07)}.btn:active{transform:scale(.96)}
.btn.alt{background:linear-gradient(90deg,#3a3f55,#596085);box-shadow:none}
.btn.g{background:linear-gradient(90deg,#12b34a,#7be04a)}.btn.o{background:linear-gradient(90deg,#ff7a00,#ffc400)}.btn.r{background:linear-gradient(90deg,#d10032,#ff2d55)}
input{font:inherit;font-size:20px;text-align:center;padding:14px 18px;border-radius:14px;border:2px solid #ff2d55;background:#0b0b16;color:#fff;outline:0;width:min(78vw,320px);user-select:text;-webkit-user-select:text}
input.bad{animation:sh .3s;border-color:#ff0}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{width:clamp(104px,29vw,170px);background:linear-gradient(180deg,#171726dd,#0b0b14dd);border:2px solid #ffffff22;border-radius:18px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;font-size:11px}
.card:hover{transform:translateY(-4px)}
.card.sel{border-color:#ff2d55;box-shadow:0 0 26px #ff2d55aa}
.card b{font-size:12px;letter-spacing:1px}.card .big{font-size:38px}
.st{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 6px;font-size:9px;text-align:left}
.st u{grid-column:1/3;height:5px;background:#333;border-radius:3px;overflow:hidden;text-decoration:none}
.st s{display:block;height:100%;background:linear-gradient(90deg,#ff2d55,#ffc400)}
.pill{padding:8px 14px;border-radius:30px;border:2px solid #fff3;background:#0008;font:inherit;font-size:11px;color:#fff;cursor:pointer}
.pill.on{border-color:#ff2d55;background:#ff2d5544}
#ui{position:fixed;inset:0;z-index:3;display:none;pointer-events:none;touch-action:none}
#ui>*{pointer-events:auto}
#top{position:absolute;top:0;left:0;right:0;padding:8px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none}
#top>*{pointer-events:auto}
#sel{display:flex;gap:4px}#sel .pill{padding:6px 9px;font-size:10px}
#quit{width:34px;height:34px;border-radius:50%;border:2px solid #fff4;background:#0009;color:#fff;font-size:16px}
#stat{font-size:12px;letter-spacing:1px;text-shadow:0 0 6px #000;margin-top:4px}
#spd{font-size:34px;font-weight:900;text-align:right;line-height:1;text-shadow:0 0 12px #ff2d55}#spd small{display:block;font-size:10px;color:#ffd9a0}
#prog{position:absolute;top:56px;left:10px;right:10px;height:5px;background:#fff2;border-radius:3px;overflow:hidden;pointer-events:none}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d55,#ffc400)}
#cd{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:clamp(70px,22vw,160px);font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 30px #ff2d55;pointer-events:none}
.pedal{position:absolute;bottom:18px;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:900;letter-spacing:2px;font-size:12px;color:#fffa;transform-origin:50% 100%;background:repeating-linear-gradient(0deg,#25252e 0 8px,#3a3a46 8px 12px);border:2px solid #666;box-shadow:0 8px 20px #000a,inset 0 0 0 3px #0006;touch-action:none}
#pg{right:12px;width:clamp(64px,19vw,100px);height:clamp(110px,26vh,160px);border-color:#2fd16b}
#pb{left:12px;width:clamp(86px,24vw,130px);height:clamp(70px,16vh,100px);border-color:#ff453a}
#wheel{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:clamp(110px,32vw,160px);height:clamp(110px,32vw,160px);touch-action:none}
#wsvg{width:100%;height:100%;filter:drop-shadow(0 6px 10px #000a)}
#arr{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);gap:12px;display:none}
#arr button{width:clamp(60px,18vw,84px);height:clamp(60px,18vw,84px);border-radius:50%;border:3px solid #fff5;background:#000a;color:#fff;font-size:28px;touch-action:none}

/* Mobile touch and safe-area enhancements */
@media (max-width: 600px){
  .panel{padding:20px 14px;gap:13px}
  .btn{font-size:14px;padding:13px 24px;letter-spacing:2px}
  #top{padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
  #pb{left:max(12px, env(safe-area-inset-left));bottom:max(18px, env(safe-area-inset-bottom))}
  #pg{right:max(12px, env(safe-area-inset-right));bottom:max(18px, env(safe-area-inset-bottom))}
  #wheel{bottom:max(14px, env(safe-area-inset-bottom))}
  #arr{bottom:max(26px, env(safe-area-inset-bottom))}
}
#cv,#ui,.pedal,#wheel,#arr button{touch-action:none}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="intro" class="screen on">
  <h1 class="logo">SOYA<br>RACING</h1>
  <p class="tag">DRIFT · BURN · WIN</p>
  <button class="btn" data-go="name">NEXT ▶</button>
</div>

<div id="name" class="screen">
  <div class="panel">
    <h2>ENTER YOUR RACER NAME</h2>
    <input id="nm" maxlength="14" placeholder="Your name" autocomplete="off">
    <button class="btn" id="n1">NEXT ▶</button>
  </div>
</div>

<div id="hello" class="screen">
  <div class="panel">
    <h2 id="hi"></h2>
    <p>Ready to rule the road?</p>
    <button class="btn" data-go="veh">NEXT ▶</button>
  </div>
</div>

<div id="veh" class="screen">
  <h2>CHOOSE YOUR RIDE</h2>
  <div class="row" id="vc"></div>
  <button class="btn" data-go="mode">NEXT ▶</button>
</div>

<div id="mode" class="screen">
  <h2>CHOOSE YOUR ROAD</h2>
  <div class="row">
    <div class="card" data-m="off"><span class="big">🏜️</span><b>OFF-ROAD</b><span>Rocks, logs &amp; cars crossing from left and right</span></div>
    <div class="card" data-m="end"><span class="big">♾️</span><b>ENDLESS ROAD</b><span>Dodge traffic as far as you can</span></div>
    <div class="card" data-m="race"><span class="big">🏁</span><b>RACE</b><span>3 cars fight for 1st place</span></div>
  </div>
</div>

<div id="diff" class="screen">
  <div class="panel">
    <h2>DIFFICULTY</h2>
    <div id="trf" class="row">
      <button class="pill on" data-t="same">SAME DIRECTION</button>
      <button class="pill" data-t="two">TWO-WAY (ONCOMING)</button>
    </div>
    <div class="row">
      <button class="btn g" data-d="0">EASY</button>
      <button class="btn o" data-d="1">HARD</button>
      <button class="btn r" data-d="2">IMPOSSIBLE</button>
    </div>
  </div>
</div>

<div id="over" class="screen" style="background:#000a">
  <div class="panel">
    <h2 id="ot"></h2>
    <p id="os"></p>
    <div class="row">
      <button class="btn" id="retry">RETRY</button>
      <button class="btn alt" id="menu">MENU</button>
    </div>
  </div>
</div>

<div id="ui">
  <div id="top">
    <div style="display:flex;gap:8px;align-items:flex-start">
      <button id="quit">✕</button>
      <div id="stat"></div>
    </div>
    <div id="sel">
      <button class="pill on" data-sm="wheel">WHEEL</button>
      <button class="pill" data-sm="arrows">ARROWS</button>
      <button class="pill" data-sm="tilt">TILT</button>
    </div>
    <div id="spd">0<small>km/h</small></div>
  </div>
  <div id="prog"><i></i></div>
  <div id="cd"></div>
  <div class="pedal" id="pb">BRAKE</div>
  <div class="pedal" id="pg">GAS</div>
  <div id="wheel">
    <svg id="wsvg" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#1d1d24" stroke-width="12"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#ff2d55" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="M9 50h82M50 50v41" stroke="#1d1d24" stroke-width="9" stroke-linecap="round"/>
      <path d="M50 4v10" stroke="#ffc400" stroke-width="4"/>
      <circle cx="<link rel="icon" type="image/jpeg" href="1.jpg"></circle>
