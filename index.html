<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سويا ريسينج 3D - SOYA RACING 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #000; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
  
  /* شاشات اللعبة */
  .screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: all 0.5s ease; z-index: 10; background: #050510;
  }
  .hidden { opacity: 0; pointer-events: none; z-index: 0; }

  /* المقدمة */
  #intro { background: radial-gradient(circle at center, #1a1a3e 0%, #000 100%); }
  #intro h1 {
    font-size: 5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 10px;
    background: linear-gradient(45deg, #00f, #0ff, #f0f, #ff0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: glow 2s ease-in-out infinite alternate; text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
  }
  #intro h2 { font-size: 2.5rem; margin-top: 10px; color: #0ff; text-shadow: 0 0 10px #0ff; }
  @keyframes glow { from { filter: drop-shadow(0 0 10px #0ff); } to { filter: drop-shadow(0 0 30px #f0f); } }
  
  /* الأزرار */
  .btn {
    margin-top: 40px; padding: 15px 50px; font-size: 1.5rem; font-weight: bold;
    background: transparent; color: #0ff; border: 2px solid #0ff; border-radius: 50px;
    cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
  }
  .btn:hover { background: #0ff; color: #000; box-shadow: 0 0 30px #0ff; transform: scale(1.05); }

  /* شاشة الاسم */
  #nameScreen h2 { font-size: 2.5rem; margin-bottom: 30px; text-shadow: 0 0 10px #0ff; }
  #playerName {
    padding: 15px 25px; font-size: 1.5rem; border: 2px solid #0ff; border-radius: 10px;
    background: rgba(0, 0, 0, 0.5); color: #fff; outline: none; text-align: center; width: 300px;
  }
  #playerName:focus { box-shadow: 0 0 20px #0ff; border-color: #f0f; }

  /* شاشات الاختيار */
  .options-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px; }
  .option-card {
    width: 180px; height: 180px; background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(0, 255, 255, 0.3); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(5px); position: relative;
  }
  .option-card:hover { transform: translateY(-10px) scale(1.05); border-color: #0ff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.5); }
  .option-card.selected { border-color: #f0f; box-shadow: 0 0 40px #f0f; background: rgba(255, 0, 255, 0.1); }
  .option-card h3 { font-size: 1.5rem; color: #fff; margin-top: 10px; text-shadow: 0 0 5px #0ff; }
  .option-card .icon { font-size: 4rem; margin-bottom: 10px; }

  /* شاشة اللعبة */
  #gameScreen { padding: 0; display: block; background: #000; }
  #gameCanvas { display: block; width: 100%; height: 100%; }
  
  /* لوحة المعلومات HUD */
  #hud {
    position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between;
    color: #fff; font-size: 1.2rem; text-shadow: 0 0 10px #0ff; pointer-events: none; z-index: 20;
    background: rgba(0, 0, 0, 0.6); padding: 15px 25px; border-radius: 15px;
    border: 1px solid rgba(0, 255, 255, 0.3); backdrop-filter: blur(5px); font-weight: bold;
  }
  #hud span { color: #0ff; font-size: 1.5rem; }
  #nitroBarContainer {
    width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 5px; overflow: hidden;
  }
  #nitroBar { height: 100%; width: 100%; background: linear-gradient(90deg, #0ff, #f0f); transition: width 0.1s; }

  #restartBtn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #f00; border-color: #f00; color: #fff; box-shadow: 0 0 20px #f00; display: none; }
  #restartBtn:hover { background: #ff4444; box-shadow: 0 0 40px #f00; }
  
  .game-over-text {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 4rem; color: #f00; text-shadow: 0 0 30px #f00; z-index: 25; display: none; font-weight: bold;
  }
</style>
</head>
<body>

  <!-- المقدمة -->
  <div id="intro" class="screen">
    <h1 dir="ltr">SOYA RACING</h1>
    <h2>سويا ريسينج 3D</h2>
    <button id="startBtn" class="btn">ابدأ اللعبة</button>
  </div>

  <!-- شاشة الاسم -->
  <div id="nameScreen" class="screen hidden">
    <h2>ادخل اسم المتسابق</h2>
    <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." autofocus>
    <p style="margin-top: 15px; color: #aaa;">اضغط Enter للمتابعة</p>
  </div>

  <!-- شاشة اختيار العربية -->
  <div id="carScreen" class="screen hidden">
    <h2 style="font-size: 2.5rem; text-shadow: 0 0 10px #0ff;">اختر عربيتك</h2>
    <div class="options-container">
      <div class="option-card" data-car="mercedes"><div class="icon">🚗</div><h3>مرسيدس</h3></div>
      <div class="option-card" data-car="motorcycle"><div class="icon">🏍️</div><h3>موتوسيكل</h3></div>
      <div class="option-card" data-car="lada"><div class="icon">🚙</div><h3>لادا</h3></div>
      <div class="option-card" data-car="bmw"><div class="icon">🚘</div><h3>بي إم دبليو</h3></div>
    </div>
  </div>

  <!-- شاشة اختيار الطريق -->
  <div id="trackScreen" class="screen hidden">
    <h2 style="font-size: 2.5rem; text-shadow: 0 0 10px #0ff;">اختر نوع الطريق</h2>
    <div class="options-container">
      <div class="option-card" data-track="rough"><div class="icon">🏔️</div><h3>طريق وعر</h3></div>
      <div class="option-card" data-track="infinite"><div class="icon">♾️</div><h3>طريق لا نهائي</h3></div>
      <div class="option-card" data-track="race"><div class="icon">🏁</div><h3>طريق سباق</h3></div>
    </div>
  </div>

  <!-- شاشة اللعب -->
  <div id="gameScreen" class="screen hidden">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div>المتسابق: <span id="hudName"></span></div>
      <div>السرعة: <span id="hudSpeed">0</span> كم/س</div>
      <div>المسافة: <span id="hudDistance">0</span> م</div>
      <div>
        نيترو: <span id="hudNitro">100</span>%
        <div id="nitroBarContainer"><div id="nitroBar"></div></div>
      </div>
    </div>
    <div class="game-over-text" id="gameOverText">💥 crash!</div>
    <button id="restartBtn" class="btn">إعادة المحاولة</button>
  </div>

<!-- استدعاء مكتبة Three.js للجرافيكس 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ========== إعداد المتغيرات الأساسية ==========
const canvas = document.getElementById('gameCanvas');
const intro = document.getElementById('intro');
const nameScreen = document.getElementById('nameScreen');
const carScreen = document.getElementById('carScreen');
const trackScreen = document.getElementById('trackScreen');
const gameScreen = document.getElementById('gameScreen');
const startBtn = document.getElementById('startBtn');
const playerNameInput = document.getElementById('playerName');
const restartBtn = document.getElementById('restartBtn');
const gameOverText = document.getElementById('gameOverText');
const hudName = document.getElementById('hudName');
const hudSpeed = document.getElementById('hudSpeed');
const hudDistance = document.getElementById('hudDistance');
const hudNitro = document.getElementById('hudNitro');
const nitroBar = document.getElementById('nitroBar');

let state = {
  playerName: '', car: '', track: '',
  scene: null, camera: null, renderer: null,
  playerCar: null, road: null, sideObjects: [], obstacles: [],
  game: {
    running: false, gameOver: false, distance: 0, speed: 0, baseSpeed: 2,
    playerX: 0, nitro: 100, isNitro: false, roadOffset: 0,
    keys: { left: false, right: false, nitro: false },
    clock: new THREE.Clock()
  }
};

// مواصفات العربيات
const carSpecs = {
  mercedes: { speed: 1.0, handling: 1.0, color: 0x333333, accent: 0xcccccc, isMoto: false },
  motorcycle: { speed: 1.3, handling: 1.5, color: 0xcc0000, accent: 0xffffff, isMoto: true },
  lada: { speed: 0.8, handling: 0.8, color: 0x8B4513, accent: 0xdddddd, isMoto: false },
  bmw: { speed: 1.2, handling: 1.2, color: 0x003366, accent: 0x00aaff, isMoto: false }
};

// مواصفات الطرق
const trackSpecs = {
  rough: { speedMultiplier: 0.8, fogColor: 0x3a2a1a, groundColor: 0x5a4a3a, lineColor: 0xaa8, shake: true },
  infinite: { speedMultiplier: 1.0, fogColor: 0x1a2a3a, groundColor: 0x2a3a4a, lineColor: 0x8af, shake: false },
  race: { speedMultiplier: 1.5, fogColor: 0x0a0a1a, groundColor: 0x1a1a2a, lineColor: 0xf0f, shake: false }
};

// ========== التنقل بين الشاشات ==========
function showScreen(screen) {
  [intro, nameScreen, carScreen, trackScreen, gameScreen].forEach(s => s.classList.add('hidden'));
  screen.classList.remove('hidden');
}

startBtn.addEventListener('click', () => { showScreen(nameScreen); playerNameInput.focus(); });

playerNameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const name = playerNameInput.value.trim();
    if (name) { state.playerName = name; showScreen(carScreen); }
    else { alert('من فضلك ادخل اسم المتسابق'); }
  }
});

document.querySelectorAll('[data-car]').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('[data-car]').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    state.car = card.dataset.car;
    setTimeout(() => showScreen(trackScreen), 300);
  });
});

document.querySelectorAll('[data-track]').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('[data-track]').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    state.track = card.dataset.track;
    setTimeout(() => startGame(), 300);
  });
});

// ========== إعداد الجرافيكس 3D (Three.js) ==========
function initThreeJS() {
  const spec = carSpecs[state.car];
  const track = trackSpecs[state.track];

  state.scene = new THREE.Scene();
  state.scene.fog = new THREE.Fog(track.fogColor, 10, 100); // ضباب لإخفاء نهاية الطريق

  state.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  state.camera.position.set(0, 3, 7);
  state.camera.lookAt(0, 0, 0);

  state.renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  state.renderer.setSize(window.innerWidth, window.innerHeight);
  state.renderer.shadowMap.enabled = true;
  state.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // الإضاءة
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  state.scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 50;
  dirLight.shadow.camera.left = -15;
  dirLight.shadow.camera.right = 15;
  dirLight.shadow.camera.top = 15;
  dirLight.shadow.camera.bottom = -15;
  state.scene.add(dirLight);

  // ضوء النيون تحت العربية
  const neonLight = new THREE.PointLight(spec.accent, 2, 10);
  neonLight.position.set(0, 0.5, 0);
  state.scene.add(neonLight);

  // الأرضية
  const groundGeo = new THREE.PlaneGeometry(200, 200);
  const groundMat = new THREE.MeshStandardMaterial({ color: track.groundColor });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.1;
  ground.receiveShadow = true;
  state.scene.add(ground);

  // الطريق
  const roadGeo = new THREE.PlaneGeometry(12, 200);
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0;
  road.receiveShadow = true;
  state.scene.add(road);

  // خطوط الطريق
  for (let i = 0; i < 20; i++) {
    const lineGeo = new THREE.PlaneGeometry(0.3, 3);
    const lineMat = new THREE.MeshStandardMaterial({ color: track.lineColor, emissive: track.lineColor, emissiveIntensity: 0.5 });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.01, -i * 10);
    state.scene.add(line);
    state.sideObjects.push({ mesh: line, type: 'line' });
  }

  // حواجز الجانبين
  for (let i = 0; i < 20; i++) {
    const barrierGeo = new THREE.BoxGeometry(0.5, 1, 5);
    const barrierMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000 });
    const barrierR = new THREE.Mesh(barrierGeo, barrierMat);
    barrierR.position.set(6, 0.5, -i * 10);
    barrierR.castShadow = true;
    state.scene.add(barrierR);
    state.sideObjects.push({ mesh: barrierR, type: 'barrier' });

    const barrierL = new THREE.Mesh(barrierGeo, barrierMat);
    barrierL.position.set(-6, 0.5, -i * 10);
    barrierL.castShadow = true;
    state.scene.add(barrierL);
    state.sideObjects.push({ mesh: barrierL, type: 'barrier' });
  }

  // جبال على الجانبين (لإعطاء إحساس بالسرعة)
  for (let i = 0; i < 15; i++) {
    const mountainGeo = new THREE.ConeGeometry(5 + Math.random() * 5, 10 + Math.random() * 15, 4);
    const mountainMat = new THREE.MeshStandardMaterial({ color: 0x222222, flatShading: true });
    const mountain = new THREE.Mesh(mountainGeo, mountainMat);
    const side = Math.random() > 0.5 ? 1 : -1;
    mountain.position.set(side * (15 + Math.random() * 20), 0, -i * 30);
    mountain.castShadow = true;
    state.scene.add(mountain);
    state.sideObjects.push({ mesh: mountain, type: 'mountain' });
  }

  // بناء العربية
  state.playerCar = createCar(spec);
  state.scene.add(state.playerCar);
}

// دالة بناء العربية 3D
function createCar(spec) {
  const carGroup = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: spec.color, metalness: 0.8, roughness: 0.2 });
  const accentMat = new THREE.MeshStandardMaterial({ color: spec.accent, emissive: spec.accent, emissiveIntensity: 0.5 });

  if (spec.isMoto) {
    // الموتوسيكل
    const bodyGeo = new THREE.BoxGeometry(0.6, 0.6, 2);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.6;
    body.castShadow = true;
    carGroup.add(body);

    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const wheelF = new THREE.Mesh(wheelGeo, wheelMat);
    wheelF.rotation.z = Math.PI / 2;
    wheelF.position.set(0, 0.4, 1);
    carGroup.add(wheelF);
    const wheelB = new THREE.Mesh(wheelGeo, wheelMat);
    wheelB.rotation.z = Math.PI / 2;
    wheelB.position.set(0, 0.4, -1);
    carGroup.add(wheelB);

    const headlight = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), accentMat);
    headlight.position.set(0, 0.8, 1.1);
    carGroup.add(headlight);
  } else {
    // العربية
    const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.8;
    body.castShadow = true;
    carGroup.add(body);

    const cabinGeo = new THREE.BoxGeometry(1.6, 0.7, 2);
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
    cabin.position.set(0, 1.55, -0.5);
    cabin.castShadow = true;
    carGroup.add(cabin);

    // الكشافات
    const lightGeo = new THREE.BoxGeometry(0.5, 0.2, 0.1);
    const lightR = new THREE.Mesh(lightGeo, accentMat);
    lightR.position.set(0.6, 0.8, 2.05);
    carGroup.add(lightR);
    const lightL = new THREE.Mesh(lightGeo, accentMat);
    lightL.position.set(-0.6, 0.8, 2.05);
    carGroup.add(lightL);

    // العجلات
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
    const positions = [[-1, 0.4, 1.2], [1, 0.4, 1.2], [-1, 0.4, -1.2], [1, 0.4, -1.2]];
    positions.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(...pos);
      wheel.castShadow = true;
      carGroup.add(wheel);
    });
  }

  // شعلة النيترو (مخفية في البداية)
  const flameGeo = new THREE.ConeGeometry(0.3, 1.5, 8);
  const flameMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.8 });
  const flame = new THREE.Mesh(flameGeo, flameMat);
  flame.rotation.x = Math.PI / 2;
  flame.position.set(0, 0.5, -2.5);
  flame.visible = false;
  flame.name = "nitroFlame";
  carGroup.add(flame);

  return carGroup;
}

// ========== بدء اللعبة ==========
function startGame() {
  showScreen(gameScreen);
  
  // إعادة تهيئة الحالة
  state.game = {
    running: true, gameOver: false, distance: 0, speed: 0, baseSpeed: 30,
    playerX: 0, nitro: 100, isNitro: false, roadOffset: 0,
    keys: { left: false, right: false, nitro: false },
    clock: new THREE.Clock()
  };
  
  hudName.textContent = state.playerName;
  gameOverText.style.display = 'none';
  restartBtn.style.display = 'none';
  
  initThreeJS();
  
  window.addEventListener('resize', onWindowResize, false);
  requestAnimationFrame(gameLoop);
}

function onWindowResize() {
  state.camera.aspect = window.innerWidth / window.innerHeight;
  state.camera.updateProjectionMatrix();
  state.renderer.setSize(window.innerWidth, window.innerHeight);
}

// ========== التحكم ==========
window.addEventListener('keydown', (e) => {
  if (!state.game || !state.game.running) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.game.keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.game.keys.right = true;
  if (e.key === ' ' || e.key === 'Shift') state.game.keys.nitro = true;
});
window.addEventListener('keyup', (e) => {
  if (!state.game) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.game.keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.game.keys.right = false;
  if (e.key === ' ' || e.key === 'Shift') state.game.keys.nitro = false;
});

// ========== حلقة اللعب الرئيسية ==========
function gameLoop() {
  if (!state.game || !state.game.running) return;
  
  const dt = Math.min(state.game.clock.getDelta(), 0.1);
  
  if (!state.game.gameOver) {
    update(dt);
  }
  state.renderer.render(state.scene, state.camera);
  
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  const g = state.game;
  const spec = carSpecs[state.car];
  const track = trackSpecs[state.track];
  
  // التحكم في النيترو
  if (g.keys.nitro && g.nitro > 0) {
    g.isNitro = true;
    g.nitro -= 30 * dt;
    if (g.nitro < 0) g.nitro = 0;
  } else {
    g.isNitro = false;
    g.nitro += 10 * dt;
    if (g.nitro > 100) g.nitro = 100;
  }
  hudNitro.textContent = Math.floor(g.nitro);
  nitroBar.style.width = g.nitro + '%';
  
  // حساب السرعة
  const targetSpeed = g.isNitro ? g.baseSpeed * spec.speed * track.speedMultiplier * 2 : g.baseSpeed * spec.speed * track.speedMultiplier;
  g.speed += (targetSpeed - g.speed) * 2 * dt;
  
  g.distance += g.speed * dt * 2;
  
  // تأثير الكاميرا مع النيترو
  const targetFOV = g.isNitro ? 90 : 75;
  state.camera.fov += (targetFOV - state.camera.fov) * 5 * dt;
  state.camera.updateProjectionMatrix();
  
  // حركة العربية يمين وشمال
  const moveSpeed = 12 * spec.handling * dt;
  if (g.keys.left) g.playerX -= moveSpeed;
  if (g.keys.right) g.playerX += moveSpeed;
  if (g.playerX < -4) g.playerX = -4;
  if (g.playerX > 4) g.playerX = 4;
  
  // تطبيق حركة العربية مع اهتزاز بسيط
  state.playerCar.position.x = g.playerX;
  state.playerCar.position.y = g.isNitro ? Math.sin(performance.now() * 0.05) * 0.05 : 0;
  state.playerCar.rotation.z = (g.playerX * -0.05) + (g.isNitro ? Math.sin(performance.now() * 0.1) * 0.02 : 0);
  
  // إظهار شعلة النيترو
  const flame = state.playerCar.getObjectByName("nitroFlame");
  if (flame) {
    flame.visible = g.isNitro;
    if (g.isNitro) {
      flame.scale.set(1, 1 + Math.random() * 0.5, 1);
    }
  }
  
  // تحريك الطريق والعناصر نحو الكاميرا (لإيهام بالحركة)
  const moveZ = g.speed * dt * 5;
  state.sideObjects.forEach(obj => {
    obj.mesh.position.z += moveZ;
    if (obj.mesh.position.z > 20) {
      obj.mesh.position.z -= 200; // إعادة التدوير
    }
  });
  
  // توليد العوائق
  if (Math.random() < 0.02 * (g.speed / 30) * dt * 60) {
    createObstacle();
  }
  
  // تحديث العوائق
  for (let i = state.obstacles.length - 1; i >= 0; i--) {
    const obs = state.obstacles[i];
    obs.mesh.position.z += moveZ;
    
    // كشف التصادم
    if (
      obs.mesh.position.z > -3 && obs.mesh.position.z < 3 &&
      Math.abs(obs.mesh.position.x - g.playerX) < 1.5
    ) {
      g.gameOver = true;
      g.running = false;
      gameOverText.style.display = 'block';
      restartBtn.style.display = 'block';
      break;
    }
    
    if (obs.mesh.position.z > 20) {
      state.scene.remove(obs.mesh);
      state.obstacles.splice(i, 1);
    }
  }
  
  // تحديث لوحة المعلومات
  hudSpeed.textContent = Math.floor(g.speed * 3);
  hudDistance.textContent = Math.floor(g.distance);
}

function createObstacle() {
  const obsGeo = new THREE.BoxGeometry(2, 2, 2);
  const obsMat = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0x551100 });
  const obs = new THREE.Mesh(obsGeo, obsMat);
  
  const lane = Math.floor(Math.random() * 5) - 2; // -2 إلى 2
  obs.position.set(lane * 2, 1, -100);
  obs.castShadow = true;
  obs.receiveShadow = true;
  
  state.scene.add(obs);
  state.obstacles.push({ mesh: obs });
}

// إعادة المحاولة
restartBtn.addEventListener('click', () => {
  // تنظيف المشهد القديم
  if (state.scene) {
    while(state.scene.children.length > 0){ 
      state.scene.remove(state.scene.children[0]); 
    }
  }
  state.obstacles = [];
  state.sideObjects = [];
  startGame();
});

// بدء اللعبة من المقدمة
showScreen(intro);
</script>
