
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOOYAH RACING 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
button,input{font:inherit}button{color:white;cursor:pointer;touch-action:none}
.screen{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,#173958,#030710 75%)}
.screen.active{display:flex}
.panel{width:min(650px,100%);max-height:95dvh;overflow:auto;padding:25px;text-align:center;border:1px solid #34d9ff;border-radius:20px;background:linear-gradient(145deg,#10253a,#040914);box-shadow:0 0 35px #00baff25}
.logo{font-size:clamp(40px,9vw,72px);font-weight:1000;font-style:italic;color:#c8f7ff;text-shadow:0 0 18px #00aaff}
h2{font-size:clamp(22px,5vw,32px)}
p{color:#abc1d6}
.btn{padding:12px 20px;margin:5px;border:1px solid #8cefff;border-radius:10px;background:linear-gradient(130deg,#078eea,#0645a9);font-weight:bold}
.field{display:block;width:100%;max-width:350px;margin:20px auto;padding:13px;background:#07111d;color:white;border:1px solid #00bfff;border-radius:10px;text-align:center}
.options{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}
.option{background:#10243a;border:1px solid #42627e;padding:13px;border-radius:12px}
.option.selected{border:2px solid #00dcff;box-shadow:0 0 14px #00bfff44}
#game{display:none;position:fixed;inset:0;background:#8bc8e9}
#game.active{display:block}
#cv{width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.info{padding:9px;background:#071525e8;border:1px solid #56d9ff;border-radius:9px;font-size:12px;font-weight:bold}
.hud .btn{padding:8px;margin:0}
#controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 12px;gap:8px;pointer-events:none}
#controls button{pointer-events:auto}
.steering,.pedals{display:flex;gap:8px;align-items:end}
.steer{width:clamp(53px,11vw,76px);height:clamp(53px,11vw,76px);border-radius:50%;font-size:26px;background:#091b2ee8;border:2px solid #b5efff}
.pedal{width:clamp(63px,13vw,86px);height:clamp(100px,19vh,140px);border:2px solid #e2f5ff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;font-size:12px;font-weight:bold}
#gas{background:linear-gradient(#17674a,#061a15);border-color:#6affb4}
#brake{background:linear-gradient(#a52c37,#260b12);border-color:#ff969b}
.plate{width:64%;height:48%;border:2px solid #bacad5;border-radius:5px;background:repeating-linear-gradient(120deg,#bac6cf 0 5px,#3b4b5a 5px 10px)}
#message{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#020812d9;text-align:center;padding:20px}
#message.show{display:flex}
.card{padding:25px;background:#091829;border:1px solid #36d9ff;border-radius:18px;max-width:380px;width:100%}
@media(max-height:450px){.pedal{height:82px}.plate{height:30%}.steer{width:47px;height:47px}}
</style>
</head>
<body>
<section id="intro" class="screen active"><div class="panel">
<div style="color:#ffd66d;font-size:30px">♛</div><div class="logo">SOOYAH</div>
<div class="logo" style="font-size:30px;letter-spacing:8px">RACING</div>
<p>NEXT GENERATION • 2026</p><button class="btn" onclick="show('name')">NEXT ➜</button>
</div></section>

<section id="name" class="screen"><div class="panel">
<h2>Enter the name</h2><input id="playerName" class="field" maxlength="20" placeholder="اسم المتسابق">
<button class="btn" onclick="enterName()">NEXT ➜</button>
</div></section>

<section id="welcome" class="screen"><div class="panel">
<div class="logo" style="font-size:40px">SOOYAH RACING</div><h2 id="hello">Hi, Driver!</h2>
<button class="btn" onclick="show('garage')">ENTER GAME ➜</button>
</div></section>

<section id="garage" class="screen"><div class="panel">
<h2>اختار عربيتك الحديثة</h2>
<div class="options" id="cars">
<button class="option selected" onclick="pickCar(0,this)">Mercedes AMG</button>
<button class="option" onclick="pickCar(1,this)">BMW M4</button>
<button class="option" onclick="pickCar(2,this)">Hypercar</button>
</div>
<canvas id="preview" width="420" height="230" style="width:min(100%,420px);height:auto;background:linear-gradient(#102b42,#050b13);border-radius:14px"></canvas>
<p>LED • PANORAMIC ROOF • SPORT RIMS</p>
<h2>اختار الطريق</h2>
<div class="options" id="modes">
<button class="option selected" onclick="pickMode('race',this)">🏁 سباق</button>
<button class="option" onclick="pickMode('endless',this)">🌆 لا نهائي</button>
<button class="option" onclick="pickMode('rough',this)">⛰️ وعر</button>
</div>
<button class="btn" onclick="startGame()">ابدأ القيادة 🚀</button>
</div></section>

<section id="game">
<canvas id="cv"></canvas>
<div class="hud">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<div class="info">SPEED <b id="speed">0</b> KM/H</div>
<div class="info">DIST <b id="dist">0</b> M</div>
</div>
<div style="display:flex;gap:5px">
<button class="btn" onclick="toggleSound()">🔊</button>
<button class="btn" onclick="backGarage()">↩ الجراج</button>
</div>
</div>
<div id="controls">
<div class="steering"><button class="steer" id="left">◀</button><button class="steer" id="right">▶</button></div>
<div class="pedals">
<button id="brake" class="pedal"><span>فرامل</span><span class="plate"></span><span>BRAKE</span></button>
<button id="gas" class="pedal"><span>بنزين</span><span class="plate"></span><span>GAS</span></button>
</div>
</div>
<div id="message"><div class="card">
<h2>💥 لقد اصطدمت!</h2><p>حاول مرة أخرى!</p>
<button class="btn" onclick="startGame()">العب مرة أخرى</button>
<button class="btn" onclick="backGarage()">العودة للجراج</button>
</div></div>
</section>

<script>
const $=id=>document.getElementById(id);
function show(id){
 document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
 $('game').classList.remove('active');$(id).classList.add('active');
}
let player='Driver',car=0,mode='race';
function enterName(){
 player=$('playerName').value.trim();if(!player){$('playerName').focus();return}
 $('hello').textContent='Hi, '+player+'!';show('welcome');
}
$('playerName').addEventListener('keydown',e=>{if(e.key==='Enter')enterName()});
function pickCar(n,b){
 car=n;document.querySelectorAll('#cars button').forEach(e=>e.classList.remove('selected'));
 b.classList.add('selected');drawPreview();
}
function pickMode(n,b){
 mode=n;document.querySelectorAll('#modes button').forEach(e=>e.classList.remove('selected'));
 b.classList.add('selected');
}

const cv=$('cv'),ctx=cv.getContext('2d'),pv=$('preview'),pc=pv.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);drawPreview();
}
addEventListener('resize',resize);

const colors=['#dce8f4','#087cf0','#ff263e'];
const darks=['#34485d','#062c65','#6b0715'];

function poly(g,pts,color){
 g.fillStyle=color;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill();
}
function round(g,x,y,w,h,r,color){
 g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();
}

/* Modern aerodynamic car: thin LED lights, sculpted hood,
   panoramic roof, metallic body and sporty wheels. */
function drawModernCar(g,x,y,s,type,angle=0){
 g.save();g.translate(x,y);g.rotate(angle);g.scale(s,s);
 let col=colors[type],dark=darks[type];

 // ground shadow
 g.fillStyle='#0008';g.beginPath();g.ellipse(0,7,43,63,0,0,Math.PI*2);g.fill();

 // wide performance tires and metallic rims
 for(let yy of [-34,26])for(let xx of [-31,31]){
  round(g,xx-8,yy-12,16,27,5,'#070b10');
  round(g,xx-5,yy-8,10,18,4,'#4d5c6c');
  g.fillStyle='#c8e2ef';g.beginPath();g.arc(xx,yy,3,0,Math.PI*2);g.fill();
  for(let a=0;a<5;a++){
   g.save();g.translate(xx,yy);g.rotate(a*Math.PI*2/5);
   round(g,-1,-7,2,6,1,'#d6e9f4');g.restore();
  }
 }

 // metallic body gradients
 let body=g.createLinearGradient(-42,0,42,0);
 body.addColorStop(0,dark);body.addColorStop(.14,col);
 body.addColorStop(.34,'#f9fdff');body.addColorStop(.43,col);
 body.addColorStop(.55,dark);body.addColorStop(.73,col);body.addColorStop(1,dark);

 // low, wide, aerodynamic silhouette
 g.shadowColor=col;g.shadowBlur=13;
 poly(g,[[-22,-61],[22,-61],[32,-48],[38,-22],[37,25],
         [28,48],[18,59],[-18,59],[-28,48],[-37,25],[-38,-22],[-32,-48]],body);
 g.shadowBlur=0;

 // hood sculpting and highlights
 poly(g,[[-25,-53],[-11,-58],[0,-55],[11,-58],[25,-53],[29,-29],[0,-21],[-29,-29]],'#ffffff20');
 g.strokeStyle='#ffffff90';g.lineWidth=1.1;
 g.beginPath();g.moveTo(-25,-50);g.quadraticCurveTo(-34,-15,-29,25);g.stroke();
 g.beginPath();g.moveTo(25,-50);g.quadraticCurveTo(34,-15,29,25);g.stroke();

 // panoramic dark glass
 let glass=g.createLinearGradient(-25,-45,25,-15);
 glass.addColorStop(0,'#163247');glass.addColorStop(.3,'#a9ecff');
 glass.addColorStop(.48,'#304c62');glass.addColorStop(.75,'#091623');
 poly(g,[[-25,-46],[-17,-54],[17,-54],[25,-46],[29,-25],[-29,-25]],glass);

 // roof frame and central reflection
 g.strokeStyle='#d9f7ff99';g.lineWidth=1;
 g.beginPath();g.moveTo(-25,-46);g.lineTo(-29,-25);g.stroke();
 g.beginPath();g.moveTo(25,-46);g.lineTo(29,-25);g.stroke();
 poly(g,[[-12,-51],[3,-51],[13,-29],[-2,-29]],'#ffffff20');

 // side windows / cabin shape
 poly(g,[[-29,-22],[29,-22],[24,11],[-24,11]],'#142d42');
 poly(g,[[-25,-19],[-5,-19],[-7,6],[-23,6]],'#75cbe9a0');
 poly(g,[[5,-19],[25,-19],[23,6],[7,6]],'#4b9ac0a0');
 g.strokeStyle='#9ae7ff80';g.lineWidth=1.3;
 g.beginPath();g.moveTo(0,-20);g.lineTo(0,10);g.stroke();

 // aggressive front grille
 if(type===0){
  poly(g,[[-13,-23],[0,-18],[13,-23],[9,-14],[0,-12],[-9,-14]],'#101821');
  g.strokeStyle='#b9d4e6';g.lineWidth=1;
  g.beginPath();g.moveTo(-7,-18);g.lineTo(0,-15);g.lineTo(7,-18);g.stroke();
 }else{
  poly(g,[[-17,-22],[0,-17],[17,-22],[12,-13],[-12,-13]],'#080e15');
  for(let yy=-20;yy<-14;yy+=2){
   g.strokeStyle='#738da1';g.lineWidth=.7;
   g.beginPath();g.moveTo(-9,yy);g.lineTo(9,yy);g.stroke();
  }
 }

 // slim futuristic LED headlights
 g.shadowColor='#bdf7ff';g.shadowBlur=12;
 round(g,-29,-49,21,3,2,'#efffff');
 round(g,8,-49,21,3,2,'#efffff');
 g.shadowBlur=0;
 g.strokeStyle='#7fe9ff';g.lineWidth=1;
 g.beginPath();g.moveTo(-29,-46);g.lineTo(-13,-45);g.stroke();
 g.beginPath();g.moveTo(13,-45);g.lineTo(29,-46);g.stroke();

 // lower front splitter
 round(g,-27,-12,54,4,2,'#10161d');
 round(g,-25,-11,10,2,1,'#a9dfff');
 round(g,15,-11,10,2,1,'#a9dfff');

 // rear glass, rear deck and diffuser
 poly(g,[[-26,14],[26,14],[23,32],[0,37],[-23,32]],'#0b1b2b');
 poly(g,[[-21,16],[21,16],[16,29],[-16,29]],'#31576e');
 round(g,-30,41,60,8,3,dark);
 // long continuous LED tail light
 g.shadowColor='#ff1437';g.shadowBlur=14;
 round(g,-29,42,58,4,2,'#ff1c3c');
 round(g,-22,48,44,2,1,'#ff8a9c');
 g.shadowBlur=0;

 // sporty exhaust and diffuser
 poly(g,[[-22,51],[-15,57],[15,57],[22,51],[17,59],[-17,59]],'#10151c');
 round(g,-22,54,8,4,2,'#b9d3df');round(g,14,54,8,4,2,'#b9d3df');

 // brand emblem
 g.fillStyle='#e8faff';g.beginPath();g.arc(0,-34,3.4,0,Math.PI*2);g.fill();
 g.strokeStyle='#253c51';g.lineWidth=1;g.beginPath();g.arc(0,-34,2,0,Math.PI*2);g.stroke();

 // glossy body stripe
 g.strokeStyle='#ffffff70';g.lineWidth=.8;
 g.beginPath();g.moveTo(-31,-3);g.quadraticCurveTo(-35,12,-28,31);g.stroke();
 g.restore();
}

function drawPreview(){
 pc.clearRect(0,0,pv.width,pv.height);
 let bg=pc.createLinearGradient(0,0,0,230);
 bg.addColorStop(0,'#173c57');bg.addColorStop(1,'#030812');
 pc.fillStyle=bg;pc.fillRect(0,0,420,230);
 // showroom lights
 for(let i=0;i<7;i++){
  pc.fillStyle='#59dfff18';pc.fillRect(i*65,0,2,230);
 }
 pc.fillStyle='#ffffff10';pc.fillRect(0,176,420,54);
 drawModernCar(pc,210,110,1.18,car);
}
function dustCloud(){
 for(let i=0;i<4;i++){
  dust.push({x:W*playerX+(Math.random()-.5)*45,y:H*.80+Math.random()*16,
  vx:(Math.random()-.5)*70,vy:-Math.random()*35-8,
  life:.65+Math.random()*.65,max:1.2,r:5+Math.random()*10});
 }
}
let active=false,last=0,playerX=.5,speed=0,dist=0,scroll=0;
let gas=false,brake=false,steer=0,keys={},dust=[],traffic=[],rocks=[],spawn=0;
let audio=null,osc=null,gain=null,soundOn=true;

function startSound(){
 if(!soundOn)return;
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  if(!osc){
   osc=audio.createOscillator();let filter=audio.createBiquadFilter();gain=audio.createGain();
   osc.type='sawtooth';filter.type='lowpass';filter.frequency.value=420;
   gain.gain.value=.0001;osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start();
  }
 }catch(e){}
}
function engineSound(){
 if(!audio||!osc)return;
 osc.frequency.setTargetAtTime(48+speed*2.3,audio.currentTime,.07);
 gain.gain.setTargetAtTime(soundOn&&active&&gas?.045:.0001,audio.currentTime,.1);
}
function toggleSound(){soundOn=!soundOn;if(soundOn)startSound();engineSound()}
function crashSound(){
 if(!soundOn)return;startSound();if(!audio)return;
 let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=95;g.gain.value=.06;
 o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);o.stop(audio.currentTime+.3);
}
function startGame(){
 $('message').classList.remove('show');show('game');resize();
 active=true;speed=0;dist=0;scroll=0;playerX=.5;dust=[];traffic=[];rocks=[];spawn=0;last=performance.now();
 startSound();requestAnimationFrame(loop);
}
function backGarage(){active=false;gas=false;brake=false;engineSound();show('garage')}

function road(t){return{x:W*.5+Math.sin(scroll*.0006+t*2)*W*.025,y:H*.28+t*H*.8,w:W*(.10+.65*t)}}
function background(){
 let sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#5daee5');sky.addColorStop(.4,'#d8e7ed');sky.addColorStop(1,mode==='rough'?'#85745a':'#3b7955');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<24;i++){
  let x=i*W/21,bh=H*(.06+(i*17%9)/100);
  ctx.fillStyle=i%2?'#52738a':'#344f67';ctx.fillRect(x,H*.32-bh,W*.026,bh);
  ctx.fillStyle='#d8f0ff70';
  for(let yy=H*.32-bh+7;yy<H*.31;yy+=10)ctx.fillRect(x+4,yy,3,4);
 }
 for(let i=0;i<16;i++){
  let t=(i/16+scroll*.00035)%1,p=road(t),s=.2+t*1.5;
  for(let side of [-1,1]){
   let x=p.x+side*(p.w*.62+W*.015);
   if(mode==='rough'){
    poly(ctx,[[x-15*s,p.y],[x-5*s,p.y-20*s],[x+6*s,p.y-27*s],[x+18*s,p.y]],'#796c55');
    poly(ctx,[[x-5*s,p.y-20*s],[x+6*s,p.y-27*s],[x+10*s,p.y-12*s]],'#b9a184');
   }else{
    ctx.fillStyle='#254c3b';ctx.fillRect(x-3*s,p.y-15*s,6*s,16*s);
    poly(ctx,[[x,p.y-38*s],[x-14*s,p.y-8*s],[x+14*s,p.y-8*s]],'#26744b');
    poly(ctx,[[x,p.y-26*s],[x-11*s,p.y],[x+11*s,p.y]],'#37875a');
   }
  }
 }
}
function drawRoad(){
 for(let i=0;i<75;i++){
  let t=i/75,u=(i+1)/75,a=road(t),b=road(u),stripe=(Math.floor(i+scroll*.025)%2===0);
  poly(ctx,[[a.x-a.w*.56,a.y],[a.x+a.w*.56,a.y],[b.x+b.w*.56,b.y],[b.x-b.w*.56,b.y]],stripe?'#c9c6b9':'#747773');
  poly(ctx,[[a.x-a.w*.5,a.y],[a.x+a.w*.5,a.y],[b.x+b.w*.5,b.y],[b.x-b.w*.5,b.y]],mode==='rough'?'#756c5d':stripe?'#303b47':'#29333e');
  if(i%4<2)for(let lane of [-1/3,1/3]){
   poly(ctx,[[a.x+a.w*lane-a.w*.006,a.y],[a.x+a.w*lane+a.w*.006,a.y],
   [b.x+b.w*lane+b.w*.006,b.y],[b.x+b.w*lane-b.w*.006,b.y]],'#fff4d4');
  }
 }
}
function drawDust(dt){
 for(let i=dust.length-1;i>=0;i--){
  let p=dust[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*12;
  if(p.life<=0){dust.splice(i,1);continue}
  ctx.globalAlpha=Math.max(0,p.life/p.max)*.52;
  ctx.fillStyle=mode==='rough'?'#b5a18a':'#d2c8ae';
  ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.72,0,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function drawObstacle(o){
 let p=road(o.z),x=p.x+p.w*o.x,s=.15+o.z*1.15;
 if(o.rock){
  poly(ctx,[[x-16*s,p.y],[x-12*s,p.y-13*s],[x*s/100+x+1*s,p.y-22*s],[x+18*s,p.y-10*s],[x+20*s,p.y]],'#403e38');
  poly(ctx,[[x-12*s,p.y-13*s],[x+1*s,p.y-22*s],[x+5*s,p.y-10*s]],'#a49a85');
 }else drawModernCar(ctx,x,p.y,s,o.type);
}
function loop(now){
 if(!active)return;
 let dt=Math.min((now-last)/1000,.04);last=now;
 if(gas||keys.ArrowUp||keys.w)speed+=85*dt;else speed-=16*dt;
 if(brake||keys.ArrowDown||keys.s)speed-=120*dt;
 speed=Math.max(0,Math.min(195,speed));
 let turn=steer||((keys.ArrowLeft||keys.a)?-1:0)||((keys.ArrowRight||keys.d)?1:0);
 playerX=Math.max(.12,Math.min(.88,playerX+turn*dt*(.65+speed*.005)));
 dist+=speed*dt*.2;scroll+=speed*dt;
 if(speed>8)dustCloud();
 if(now-spawn>Math.max(450,1400-speed*4)){
  if(mode==='rough')rocks.push({z:.05,x:Math.random()*.68-.34,rock:true});
  else traffic.push({z:.04,x:Math.random()*.68-.34,type:Math.floor(Math.random()*3)});
  spawn=now;
 }
 traffic.forEach(o=>o.z+=dt*(.17+speed*.0008));
 rocks.forEach(o=>o.z+=dt*(.17+speed*.0008));
 traffic=traffic.filter(o=>o.z<1.2);rocks=rocks.filter(o=>o.z<1.2);
 if([...traffic,...rocks].some(o=>o.z>.86&&o.z<1.02&&Math.abs(o.x-(playerX-.5)*1.6)<.22)){
  active=false;gas=false;brake=false;engineSound();crashSound();$('message').classList.add('show');return;
 }
 background();drawRoad();
 traffic.forEach(o=>drawObstacle(o));rocks.forEach(o=>drawObstacle(o));
 drawDust(dt);
 // Vehicle stays prominent, with steering and suspension movement.
 let bounce=gas&&speed>20?Math.sin(now*.026)*2:0;
 drawModernCar(ctx,W*playerX,H*.77+bounce,1.24,car,turn*.08);
 $('speed').textContent=Math.round(speed);$('dist').textContent=Math.floor(dist);
 engineSound();requestAnimationFrame(loop);
}

function hold(id,down,up){
 let el=$(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();down();el.setPointerCapture?.(e.pointerId)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();up()}));
}
hold('left',()=>steer=-1,()=>steer=0);
hold('right',()=>steer=1,()=>steer=0);
hold('gas',()=>{gas=true;startSound()},()=>gas=false);
hold('brake',()=>brake=true,()=>brake=false);
addEventListener('keydown',e=>{
 keys[e.key]=true;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowUp'||e.key===' ')startSound();
},{passive:false});
addEventListener('keyup',e=>keys[e.key]=false);
addEventListener('blur',()=>{gas=false;brake=false;steer=0;keys={}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){gas=false;brake=false;steer=0}});
drawPreview();resize();
</script>
</body>
</html>
